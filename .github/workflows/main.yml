
name: Build Rupture Reborn

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Mod bauen
        run: gradle build

      - name: JAR als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rupture-reborn
          path: build/libs/*.jar
