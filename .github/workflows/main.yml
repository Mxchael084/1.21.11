
name: Build Rupture Reborn

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge Mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Gradle Build ausführen
        run: gradle build --no-daemon --stacktrace

      - name: Gebaute JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rupture-reborn-forge-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
